# Publish the latest rulebook PDF to GitHub Pages so it opens in-browser
# (release assets are always served as forced downloads, which mobile
# browsers won't display inline).
#
# The PDF can't be built in CI (it needs locally installed fonts), so this
# copies the asset from the `latest-build` release. Uploading an asset with
# --clobber doesn't fire a release event, so run ./publish.sh (or
# `gh workflow run pages.yml`) after each upload.
name: Deploy rulebook to Pages

on:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}rulebook.pdf
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rulebook.pdf from the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp site/index.html _site/
          gh release download latest-build --pattern rulebook.pdf --dir . --repo "$GITHUB_REPOSITORY"
      # The source PDF embeds full-resolution PNG art (~47 MB). Ghostscript's
      # /ebook preset (150 dpi images) brings it to ~1.3 MB with no visible
      # loss on a phone screen; the full-resolution file stays on the release.
      - name: Compress for mobile
        run: |
          command -v gs || { sudo apt-get update -q && sudo apt-get install -y --no-install-recommends ghostscript; }
          gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -dCompatibilityLevel=1.7 \
            -dPDFSETTINGS=/ebook -o _site/rulebook.pdf rulebook.pdf
          ls -l rulebook.pdf _site/rulebook.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
